<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UCO Fleet Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;-webkit-font-smoothing:antialiased}
    button{cursor:pointer}
    button:hover{opacity:.85}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
    .leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 8px 24px rgba(0,0,0,.12)!important}
    .leaflet-popup-content{margin:12px 14px!important}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Mock Data ──────────────────────────────────────────────────────────────
    const STATUS_COLORS = { active:'#22c55e', idle:'#f59e0b', offline:'#ef4444' };
    const STATUS_LABELS = { active:'Active', idle:'Idle', offline:'Offline' };
    const CP_ICONS = { restaurant:'🍽️', hotel:'🏨', canteen:'🍱', fastfood:'🍟', bakery:'🥐' };

    const COLLECTION_POINTS = [
      {id:'cp1',name:'Le Bistro Central',         type:'restaurant',lat:48.8566,lng:2.3522,ucoLiters:80, lastCollection:'2026-02-15',address:'12 Rue de Rivoli'},
      {id:'cp2',name:'Grande Brasserie',           type:'restaurant',lat:48.8606,lng:2.3376,ucoLiters:120,lastCollection:'2026-02-14',address:'5 Bd Haussmann'},
      {id:'cp3',name:'Hotel Lumière Kitchen',      type:'hotel',     lat:48.8738,lng:2.2950,ucoLiters:200,lastCollection:'2026-02-10',address:'88 Av des Ternes'},
      {id:'cp4',name:'Cafétéria Universitaire',    type:'canteen',   lat:48.8462,lng:2.3446,ucoLiters:150,lastCollection:'2026-02-12',address:'45 Rue des Écoles'},
      {id:'cp5',name:'Snack du Marché',            type:'restaurant',lat:48.8628,lng:2.3617,ucoLiters:60, lastCollection:'2026-02-16',address:'3 Rue du Temple'},
      {id:'cp6',name:'Fast & Fresh',               type:'fastfood',  lat:48.8702,lng:2.3070,ucoLiters:95, lastCollection:'2026-02-13',address:'17 Rue de Passy'},
      {id:'cp7',name:'Boulangerie Dumont',         type:'bakery',    lat:48.8519,lng:2.3688,ucoLiters:40, lastCollection:'2026-02-11',address:'22 Rue de la Bastille'},
      {id:'cp8',name:'Hôpital Saint-Louis Cantine',type:'canteen',   lat:48.8724,lng:2.3620,ucoLiters:280,lastCollection:'2026-02-09',address:'1 Av Claude Vellefaux'},
      {id:'cp9',name:'Kebab Palace',               type:'fastfood',  lat:48.8799,lng:2.3553,ucoLiters:55, lastCollection:'2026-02-16',address:'34 Rue Marx Dormoy'},
      {id:'cp10',name:'Resto du Cœur',            type:'canteen',   lat:48.8669,lng:2.3852,ucoLiters:110,lastCollection:'2026-02-08',address:'7 Rue de Lagny'},
    ];

    const DRIVERS = [
      {id:'d1',name:'Jean-Pierre Moreau',phone:'+33 6 12 34 56 78',avatar:'JP',rating:4.8},
      {id:'d2',name:'Amina Bouchard',    phone:'+33 6 23 45 67 89',avatar:'AB',rating:4.9},
      {id:'d3',name:'Luca Fernandez',    phone:'+33 6 34 56 78 90',avatar:'LF',rating:4.7},
      {id:'d4',name:'Sophie Leroy',      phone:'+33 6 45 67 89 01',avatar:'SL',rating:4.6},
    ];

    const INITIAL_VEHICLES = [
      {id:'v1',name:'UCO Truck Alpha',plate:'PA-001-UCO',type:'truck',status:'active',
       driver:DRIVERS[0],lat:48.8610,lng:2.3490,speed:32,fuelLevel:68,
       tankCapacity:1000,tankCurrent:420,mileage:87432,lastUpdate:'2 min ago',
       todayCollections:3,todayUCO:260,
       route:{current:'cp2',next:'cp5',completed:['cp1','cp2'],remaining:['cp5','cp10']},
       history:[{lat:48.8566,lng:2.3522},{lat:48.8595,lng:2.3500},{lat:48.8606,lng:2.3376},{lat:48.8610,lng:2.3490}]},
      {id:'v2',name:'UCO Truck Beta', plate:'PA-002-UCO',type:'truck',status:'active',
       driver:DRIVERS[1],lat:48.8702,lng:2.3070,speed:18,fuelLevel:45,
       tankCapacity:1000,tankCurrent:695,mileage:62187,lastUpdate:'1 min ago',
       todayCollections:4,todayUCO:445,
       route:{current:'cp6',next:'cp3',completed:['cp4','cp7','cp6'],remaining:['cp3']},
       history:[{lat:48.8462,lng:2.3446},{lat:48.8600,lng:2.3500},{lat:48.8660,lng:2.3200},{lat:48.8702,lng:2.3070}]},
      {id:'v3',name:'UCO Van Gamma',  plate:'PA-003-UCO',type:'van', status:'idle',
       driver:DRIVERS[2],lat:48.8724,lng:2.3620,speed:0,fuelLevel:92,
       tankCapacity:500,tankCurrent:110,mileage:34901,lastUpdate:'8 min ago',
       todayCollections:2,todayUCO:165,
       route:{current:'cp8',next:'cp9',completed:['cp8'],remaining:['cp9']},
       history:[{lat:48.8800,lng:2.3700},{lat:48.8760,lng:2.3650},{lat:48.8724,lng:2.3620}]},
      {id:'v4',name:'UCO Van Delta',  plate:'PA-004-UCO',type:'van', status:'offline',
       driver:DRIVERS[3],lat:48.8462,lng:2.3900,speed:0,fuelLevel:15,
       tankCapacity:500,tankCurrent:0,mileage:51223,lastUpdate:'42 min ago',
       todayCollections:0,todayUCO:0,
       route:{current:null,next:null,completed:[],remaining:[]},
       history:[{lat:48.8462,lng:2.3900}]},
    ];
    const WEEKLY = {values:[320,410,380,520,490,600,870],days:['Mon','Tue','Wed','Thu','Fri','Sat','Today']};

    // ── Helpers ────────────────────────────────────────────────────────────────
    function Bar({value,max=100,color,h=5}){
      const pct=Math.min(Math.round((value/max)*100),100);
      return <div style={{height:h,background:'#f3f4f6',borderRadius:h/2,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:h/2,transition:'width .3s'}}/>
      </div>;
    }

    // ── Leaflet Map ────────────────────────────────────────────────────────────
    function FleetMap({vehicles,selectedVehicle,onVehicleSelect,showCollectionPoints}){
      const divRef=useRef(null), mapRef=useRef(null);
      const vMarkersRef=useRef({}), cpMarkersRef=useRef([]), linesRef=useRef([]);

      useEffect(()=>{
        if(mapRef.current) return;
        mapRef.current=L.map(divRef.current).setView([48.8566,2.3522],13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
          attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19
        }).addTo(mapRef.current);
        return ()=>{ mapRef.current?.remove(); mapRef.current=null; };
      },[]);

      useEffect(()=>{
        if(!mapRef.current) return;
        Object.values(vMarkersRef.current).forEach(m=>m.remove()); vMarkersRef.current={};
        linesRef.current.forEach(l=>l.remove()); linesRef.current=[];

        vehicles.forEach(v=>{
          const col=STATUS_COLORS[v.status], sel=selectedVehicle?.id===v.id;
          const emoji=v.type==='truck'?'🚛':'🚐';
          if(v.history.length>1){
            const line=L.polyline(v.history.map(p=>[p.lat,p.lng]),{
              color:col,weight:sel?4:2,opacity:sel?.9:.35,dashArray:v.status==='offline'?'6,6':null
            }).addTo(mapRef.current);
            linesRef.current.push(line);
          }
          const icon=L.divIcon({
            html:`<div style="background:white;border:3px solid ${col};border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,${sel?.4:.2});transform:scale(${sel?1.2:1});transition:all .2s;position:relative;">
              ${emoji}<span style="position:absolute;bottom:-5px;right:-5px;width:11px;height:11px;background:${col};border-radius:50%;border:2px solid white;"></span></div>`,
            className:'',iconSize:[40,40],iconAnchor:[20,20]
          });
          const popup=`<div style="min-width:190px;font-family:system-ui,sans-serif">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span style="font-size:20px">${emoji}</span>
              <div><div style="font-weight:700;font-size:14px">${v.name}</div><div style="font-size:11px;color:#888">${v.plate}</div></div>
              <span style="margin-left:auto;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:${col}22;color:${col}">${STATUS_LABELS[v.status]}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">
              <span>👤 ${v.driver.name.split(' ')[0]}</span><span>⚡ ${v.speed} km/h</span>
              <span>⛽ ${v.fuelLevel}%</span><span>🛢️ ${v.tankCurrent}L/${v.tankCapacity}L</span>
            </div></div>`;
          const marker=L.marker([v.lat,v.lng],{icon}).addTo(mapRef.current)
            .bindPopup(popup).on('click',()=>onVehicleSelect(v));
          vMarkersRef.current[v.id]=marker;
        });
      },[vehicles,selectedVehicle]);

      useEffect(()=>{
        if(selectedVehicle&&mapRef.current)
          mapRef.current.flyTo([selectedVehicle.lat,selectedVehicle.lng],15,{duration:1});
      },[selectedVehicle?.id]);

      useEffect(()=>{
        if(!mapRef.current) return;
        cpMarkersRef.current.forEach(m=>m.remove()); cpMarkersRef.current=[];
        if(!showCollectionPoints) return;
        COLLECTION_POINTS.forEach(cp=>{
          const emoji=CP_ICONS[cp.type]||'📍';
          const icon=L.divIcon({
            html:`<div style="background:white;border:2px solid #6366f1;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.2)">${emoji}</div>`,
            className:'',iconSize:[30,30],iconAnchor:[15,15]
          });
          const popup=`<div style="min-width:170px;font-family:system-ui,sans-serif">
            <div style="font-weight:700;font-size:13px">${cp.name}</div>
            <div style="font-size:11px;color:#888;margin-top:3px">📍 ${cp.address}</div>
            <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px">
              <span>🛢️ UCO Available</span><strong style="color:#6366f1">${cp.ucoLiters}L</strong></div>
            <div style="font-size:11px;color:#aaa;margin-top:3px">Last collected: ${cp.lastCollection}</div></div>`;
          const m=L.marker([cp.lat,cp.lng],{icon}).addTo(mapRef.current).bindPopup(popup);
          cpMarkersRef.current.push(m);
        });
      },[showCollectionPoints]);

      return <div ref={divRef} style={{height:'100%',width:'100%'}}/>;
    }

    // ── Vehicle Card ───────────────────────────────────────────────────────────
    function VehicleCard({vehicle:v,isSelected,onClick}){
      const col=STATUS_COLORS[v.status];
      const tankPct=Math.round((v.tankCurrent/v.tankCapacity)*100);
      const next=v.route.next?COLLECTION_POINTS.find(p=>p.id===v.route.next):null;
      return <div onClick={onClick} style={{background:isSelected?'#eef2ff':'white',border:`2px solid ${isSelected?'#6366f1':'#e5e7eb'}`,borderRadius:12,padding:'12px 14px',cursor:'pointer',transition:'all .15s',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
          <div style={{width:38,height:38,borderRadius:10,background:col+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{v.type==='truck'?'🚛':'🚐'}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:14,color:'#111827',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.name}</div>
            <div style={{fontSize:11,color:'#9ca3af'}}>{v.plate}</div>
          </div>
          <span style={{padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:700,background:col+'20',color:col,flexShrink:0}}>{STATUS_LABELS[v.status]}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
          <div style={{width:22,height:22,borderRadius:'50%',background:'#6366f1',color:'white',fontSize:9,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{v.driver.avatar}</div>
          <span style={{fontSize:12,color:'#4b5563',flex:1}}>{v.driver.name}</span>
          <span style={{fontSize:11,color:'#9ca3af'}}>⏱ {v.lastUpdate}</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:8}}>
          {[{l:'Speed',val:`${v.speed} km/h`},{l:'Fuel',val:`${v.fuelLevel}%`,w:v.fuelLevel<20},{l:'Tank',val:`${tankPct}%`,g:tankPct>60}].map(({l,val,w,g})=>(
            <div key={l} style={{background:'#f9fafb',borderRadius:6,padding:'4px 6px',textAlign:'center'}}>
              <div style={{fontSize:10,color:'#9ca3af'}}>{l}</div>
              <div style={{fontSize:12,fontWeight:700,color:w?'#ef4444':g?'#22c55e':'#374151'}}>{val}</div>
            </div>
          ))}
        </div>
        <div style={{marginBottom:4}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#9ca3af',marginBottom:2}}><span>Fuel</span><span>{v.fuelLevel}%</span></div>
          <Bar value={v.fuelLevel} color={v.fuelLevel<20?'#ef4444':v.fuelLevel<40?'#f59e0b':'#22c55e'} h={4}/>
        </div>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#9ca3af',marginBottom:2}}><span>UCO Tank</span><span>{v.tankCurrent}/{v.tankCapacity}L</span></div>
          <Bar value={v.tankCurrent} max={v.tankCapacity} color={tankPct>80?'#ef4444':tankPct>50?'#f59e0b':'#6366f1'} h={4}/>
        </div>
        {next&&<div style={{marginTop:8,padding:'5px 8px',background:'#f9fafb',borderRadius:8,display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#6b7280'}}>
          <span>🧭</span><span>Next:</span><span style={{color:'#111827',fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{next.name}</span>
          <span style={{color:'#6366f1',fontWeight:700,flexShrink:0}}>{next.ucoLiters}L</span>
        </div>}
      </div>;
    }

    // ── Sidebar ────────────────────────────────────────────────────────────────
    function Sidebar({vehicles,selectedVehicle,onVehicleSelect}){
      const [search,setSearch]=useState('');
      const [filter,setFilter]=useState('all');
      const filtered=vehicles.filter(v=>{
        const q=search.toLowerCase();
        const m=v.name.toLowerCase().includes(q)||v.driver.name.toLowerCase().includes(q)||v.plate.toLowerCase().includes(q);
        return m&&(filter==='all'||v.status===filter);
      });
      const counts={all:vehicles.length,active:vehicles.filter(v=>v.status==='active').length,idle:vehicles.filter(v=>v.status==='idle').length,offline:vehicles.filter(v=>v.status==='offline').length};
      return <div style={{width:310,background:'#f8fafc',borderRight:'1px solid #e5e7eb',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'14px 14px 10px',background:'white',borderBottom:'1px solid #e5e7eb'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
            <span style={{fontSize:18}}>🚛</span>
            <span style={{fontWeight:700,fontSize:15,color:'#111827'}}>Fleet Vehicles</span>
            <span style={{marginLeft:'auto',background:'#6366f180',color:'#6366f1',fontWeight:700,fontSize:12,padding:'1px 8px',borderRadius:20}}>{vehicles.length}</span>
          </div>
          <div style={{position:'relative',marginBottom:8}}>
            <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#9ca3af'}}>🔍</span>
            <input type="text" placeholder="Search vehicle, driver, plate..." value={search} onChange={e=>setSearch(e.target.value)}
              style={{width:'100%',padding:'7px 28px 7px 28px',borderRadius:8,border:'1px solid #e5e7eb',fontSize:13,outline:'none',background:'#f9fafb'}}/>
            {search&&<button onClick={()=>setSearch('')} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'#9ca3af',fontSize:14,padding:0}}>✕</button>}
          </div>
          <div style={{display:'flex',gap:4}}>
            {['all','active','idle','offline'].map(s=>(
              <button key={s} onClick={()=>setFilter(s)} style={{flex:1,padding:'4px 0',borderRadius:6,border:'none',fontSize:11,fontWeight:700,transition:'all .15s',
                background:filter===s?(s==='all'?'#6366f1':STATUS_COLORS[s]):'#f3f4f6',color:filter===s?'white':'#6b7280'}}>
                {s.charAt(0).toUpperCase()+s.slice(1)}<div style={{fontSize:14,fontWeight:800,lineHeight:1.2}}>{counts[s]}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:10}}>
          {filtered.length===0
            ?<div style={{textAlign:'center',color:'#9ca3af',marginTop:40,fontSize:13}}>No vehicles match filter</div>
            :filtered.map(v=><VehicleCard key={v.id} vehicle={v} isSelected={selectedVehicle?.id===v.id} onClick={()=>onVehicleSelect(selectedVehicle?.id===v.id?null:v)}/>)
          }
        </div>
      </div>;
    }

    // ── Vehicle Detail ─────────────────────────────────────────────────────────
    function RouteStop({point,status,isLast}){
      const dot=status==='done'?'✅':status==='current'?'🔵':'⚪';
      return <div style={{display:'flex',gap:10,marginBottom:isLast?0:10}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0}}>
          <span style={{fontSize:14}}>{dot}</span>
          {!isLast&&<div style={{width:2,flex:1,background:status==='done'?'#22c55e40':'#e5e7eb',marginTop:4}}/>}
        </div>
        <div style={{flex:1,paddingBottom:isLast?0:10}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span>{CP_ICONS[point.type]||'📍'}</span>
            <span style={{fontSize:13,fontWeight:status==='current'?700:500,color:status==='pending'?'#9ca3af':'#111827'}}>{point.name}</span>
            {status==='current'&&<span style={{marginLeft:'auto',fontSize:10,background:'#e0e7ff',color:'#6366f1',padding:'1px 6px',borderRadius:10,fontWeight:700}}>Now</span>}
          </div>
          <div style={{fontSize:11,color:'#9ca3af',marginTop:2}}>🛢️ {point.ucoLiters}L · 📍 {point.address}</div>
        </div>
      </div>;
    }

    function VehicleDetail({vehicle:v,onClose}){
      if(!v) return null;
      const col=STATUS_COLORS[v.status];
      const tankPct=Math.round((v.tankCurrent/v.tankCapacity)*100);
      const done=v.route.completed.map(id=>COLLECTION_POINTS.find(p=>p.id===id)).filter(Boolean);
      const cur=v.route.current?COLLECTION_POINTS.find(p=>p.id===v.route.current):null;
      const rem=v.route.remaining.map(id=>COLLECTION_POINTS.find(p=>p.id===id)).filter(Boolean);
      return <div style={{width:295,background:'white',borderLeft:'1px solid #e5e7eb',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:16,background:`linear-gradient(135deg,${col}12,${col}06)`,borderBottom:'1px solid #e5e7eb'}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
            <div style={{width:46,height:46,borderRadius:12,background:col+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>{v.type==='truck'?'🚛':'🚐'}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:15,color:'#111827'}}>{v.name}</div>
              <div style={{fontSize:11,color:'#9ca3af'}}>{v.plate}</div>
              <span style={{display:'inline-block',marginTop:5,padding:'2px 10px',borderRadius:20,fontSize:11,fontWeight:700,background:col+'20',color:col}}>● {STATUS_LABELS[v.status]}</span>
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:18,color:'#9ca3af',padding:0,lineHeight:1}}>✕</button>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          <Section title="👤 Driver">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:'#6366f1',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13}}>{v.driver.avatar}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14,color:'#111827'}}>{v.driver.name}</div>
                <div style={{fontSize:12,color:'#6b7280'}}>📞 {v.driver.phone}</div>
              </div>
              <div style={{fontSize:13,fontWeight:700}}>⭐ {v.driver.rating}</div>
            </div>
          </Section>
          <Section title="⚡ Live Status">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[{e:'⚡',l:'Speed',val:`${v.speed} km/h`,c:'#6366f1'},{e:'⏱',l:'Updated',val:v.lastUpdate,c:'#6b7280'},
                {e:'🛢️',l:"Today's UCO",val:`${v.todayUCO}L`,c:'#22c55e'},{e:'📦',l:'Collections',val:v.todayCollections,c:'#f59e0b'}
              ].map(({e,l,val,c})=>(
                <div key={l} style={{background:'#f9fafb',borderRadius:8,padding:'8px 10px',border:'1px solid #f3f4f6'}}>
                  <div style={{fontSize:11,color:'#9ca3af',marginBottom:3}}>{e} {l}</div>
                  <div style={{fontSize:15,fontWeight:800,color:c}}>{val}</div>
                </div>
              ))}
            </div>
          </Section>
          <Section title="🚗 Vehicle">
            {[{l:'Fuel Level',val:v.fuelLevel,max:100,s:`${v.fuelLevel}%`,c:v.fuelLevel<20?'#ef4444':v.fuelLevel<40?'#f59e0b':'#22c55e'},
              {l:'UCO Tank',val:v.tankCurrent,max:v.tankCapacity,s:`${v.tankCurrent}L / ${v.tankCapacity}L`,c:tankPct>80?'#ef4444':tankPct>50?'#f59e0b':'#6366f1'}
            ].map(({l,val,max,s,c})=>(
              <div key={l} style={{marginBottom:8}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#6b7280',marginBottom:4}}><span>{l}</span><span style={{fontWeight:600,color:'#374151'}}>{s}</span></div>
                <Bar value={val} max={max} color={c} h={6}/>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#9ca3af',marginTop:4}}>
              <span>Total mileage</span><span style={{color:'#374151',fontWeight:500}}>{v.mileage.toLocaleString()} km</span>
            </div>
          </Section>
          <Section title="🧭 Today's Route" last>
            {done.length===0&&!cur&&rem.length===0
              ?<div style={{color:'#9ca3af',fontSize:13}}>No route assigned</div>
              :<>
                {done.map((p,i)=><RouteStop key={p.id} point={p} status="done" isLast={false}/>)}
                {cur&&<RouteStop point={cur} status="current" isLast={rem.length===0}/>}
                {rem.map((p,i)=><RouteStop key={p.id} point={p} status="pending" isLast={i===rem.length-1}/>)}
              </>
            }
          </Section>
        </div>
      </div>;
    }

    function Section({title,children,last}){
      return <div style={{padding:'12px 16px',borderBottom:last?'none':'1px solid #f3f4f6'}}>
        <div style={{fontSize:11,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>{title}</div>
        {children}
      </div>;
    }

    // ── Header ─────────────────────────────────────────────────────────────────
    function Header({vehicles,showCPs,onToggleCPs,onRefresh}){
      const active=vehicles.filter(v=>v.status==='active').length;
      const idle=vehicles.filter(v=>v.status==='idle').length;
      const offline=vehicles.filter(v=>v.status==='offline').length;
      const todayUCO=vehicles.reduce((s,v)=>s+v.todayUCO,0);
      const target=1500, pct=Math.round((todayUCO/target)*100);
      const maxW=Math.max(...WEEKLY.values);
      return <header style={{background:'white',borderBottom:'1px solid #e5e7eb',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:14,height:54,padding:'0 16px',borderBottom:'1px solid #f3f4f6'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:34,height:34,borderRadius:10,background:'linear-gradient(135deg,#6366f1,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🚛</div>
            <div>
              <div style={{fontWeight:800,fontSize:15,color:'#111827',lineHeight:1}}>UCO Fleet</div>
              <div style={{fontSize:10,color:'#9ca3af'}}>Collection Manager</div>
            </div>
          </div>
          <div style={{width:1,height:30,background:'#e5e7eb'}}/>
          {[{count:active,label:'Active',color:'#22c55e'},{count:idle,label:'Idle',color:'#f59e0b'},{count:offline,label:'Offline',color:'#ef4444'}].map(({count,label,color})=>(
            <div key={label} style={{display:'flex',alignItems:'center',gap:5,fontSize:12}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:color,display:'inline-block'}}/>
              <strong style={{color:'#111827'}}>{count}</strong>
              <span style={{color:'#9ca3af'}}>{label}</span>
            </div>
          ))}
          <div style={{flex:1}}/>
          <button onClick={onToggleCPs} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,
            border:`1px solid ${showCPs?'#6366f1':'#e5e7eb'}`,background:showCPs?'#eef2ff':'white',
            fontSize:12,color:showCPs?'#6366f1':'#6b7280',fontWeight:showCPs?600:400}}>
            📍 Collection Points
          </button>
          <button onClick={onRefresh} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,border:'1px solid #e5e7eb',background:'white',fontSize:12,color:'#6b7280'}}>
            🔄 Refresh
          </button>
          <div style={{position:'relative'}}>
            <span style={{fontSize:22,cursor:'pointer'}}>🔔</span>
            <span style={{position:'absolute',top:0,right:0,width:8,height:8,background:'#ef4444',borderRadius:'50%',border:'2px solid white',display:'block'}}/>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:20,height:50,padding:'0 16px',overflowX:'auto'}}>
          <div style={{flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:28,height:28,borderRadius:8,background:'#6366f115',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🛢️</div>
              <div>
                <div style={{fontSize:10,color:'#9ca3af'}}>Today's UCO</div>
                <div style={{fontSize:15,fontWeight:800,color:'#111827',lineHeight:1.2}}>{todayUCO}L <span style={{fontSize:11,fontWeight:400,color:'#9ca3af'}}>/ {target}L target</span></div>
              </div>
            </div>
            <div style={{marginTop:3}}><Bar value={pct} color="#6366f1" h={3}/></div>
          </div>
          <div style={{width:1,height:34,background:'#f3f4f6',flexShrink:0}}/>
          <div style={{flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:28,height:28,borderRadius:8,background:'#22c55e15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>📍</div>
              <div>
                <div style={{fontSize:10,color:'#9ca3af'}}>Pending Pickups</div>
                <div style={{fontSize:15,fontWeight:800,color:'#111827',lineHeight:1.2}}>4 <span style={{fontSize:11,fontWeight:400,color:'#9ca3af'}}>of 10 points</span></div>
              </div>
            </div>
          </div>
          <div style={{width:1,height:34,background:'#f3f4f6',flexShrink:0}}/>
          <div style={{flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:28,height:28,borderRadius:8,background:'#f59e0b15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🚛</div>
              <div>
                <div style={{fontSize:10,color:'#9ca3af'}}>Fleet Active</div>
                <div style={{fontSize:15,fontWeight:800,color:'#111827',lineHeight:1.2}}>{active}/{vehicles.length} <span style={{fontSize:11,fontWeight:400,color:'#9ca3af'}}>on route</span></div>
              </div>
            </div>
          </div>
          <div style={{width:1,height:34,background:'#f3f4f6',flexShrink:0}}/>
          <div style={{display:'flex',gap:3,alignItems:'flex-end',flexShrink:0}}>
            {WEEKLY.values.map((val,i)=>(
              <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                <div style={{width:16,height:Math.max(4,Math.round((val/maxW)*34)),background:i===WEEKLY.values.length-1?'#6366f1':'#c7d2fe',borderRadius:3}}/>
                <span style={{fontSize:9,color:'#9ca3af'}}>{WEEKLY.days[i]}</span>
              </div>
            ))}
            <span style={{fontSize:11,color:'#6b7280',marginLeft:4,alignSelf:'center'}}>📈 Weekly</span>
          </div>
        </div>
      </header>;
    }

    // ── App ────────────────────────────────────────────────────────────────────
    function App(){
      const [vehicles,setVehicles]=useState(INITIAL_VEHICLES);
      const [selected,setSelected]=useState(null);
      const [showCPs,setShowCPs]=useState(true);

      const handleRefresh=useCallback(()=>{
        setVehicles(prev=>prev.map(v=>{
          if(v.status!=='active') return v;
          const j=()=>(Math.random()-.5)*.002;
          return {...v,lat:v.lat+j(),lng:v.lng+j(),speed:Math.max(5,v.speed+Math.round((Math.random()-.5)*10)),lastUpdate:'just now'};
        }));
      },[]);

      const detail=selected?vehicles.find(v=>v.id===selected.id)||selected:null;

      return <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
        <Header vehicles={vehicles} showCPs={showCPs} onToggleCPs={()=>setShowCPs(p=>!p)} onRefresh={handleRefresh}/>
        <div style={{flex:1,display:'flex',overflow:'hidden'}}>
          <Sidebar vehicles={vehicles} selectedVehicle={detail} onVehicleSelect={setSelected}/>
          <div style={{flex:1,position:'relative'}}>
            <FleetMap vehicles={vehicles} selectedVehicle={detail}
              onVehicleSelect={v=>setSelected(prev=>prev?.id===v.id?null:v)}
              showCollectionPoints={showCPs}/>
          </div>
          {detail&&<VehicleDetail vehicle={detail} onClose={()=>setSelected(null)}/>}
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
